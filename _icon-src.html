<!doctype html>
<!-- Source art for the app icons. Not shipped to the phone - rendered to PNG by
     the chrome --headless --screenshot commands in README.md.

     The icon is one viewBox'd SVG pinned to the top-left corner at an exact
     pixel size passed in as ?size=NNN. Headless Chrome does not reliably size
     its viewport from --window-size, so vw/vh units and centred layout both
     render at the wrong scale - fixed pixels anchored at 0,0 are what survive. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #0f1115; }
  svg { display: block; position: absolute; top: 0; left: 0; }
</style>
</head>
<body>
<svg id="icon" viewBox="0 0 100 100" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g" cx="30%" cy="18%" r="115%">
      <stop offset="0%" stop-color="#1f2836"/>
      <stop offset="62%" stop-color="#0f1115"/>
    </radialGradient>
  </defs>
  <rect id="bg" width="100" height="100" fill="url(#g)"/>
  <polyline id="mark" points="27,51 43,67 74,32"
            fill="none" stroke="#4ade80" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<script>
  var q = new URLSearchParams(location.search);
  var size = parseInt(q.get('size'), 10) || 512;
  var icon = document.getElementById('icon');
  icon.setAttribute('width', size);
  icon.setAttribute('height', size);

  // Maskable icons get cropped to a circle by some launchers, so shrink the
  // mark toward the centre to keep it inside the safe zone.
  if (q.has('maskable')) {
    document.getElementById('mark')
      .setAttribute('transform', 'translate(50 50) scale(0.68) translate(-50 -50)');
    document.getElementById('bg').setAttribute('fill', '#0f1115');
  }
</script>
</body>
</html>
