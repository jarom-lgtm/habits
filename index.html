<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115;
    --card: #191d26;
    --card-hi: #222734;
    --line: #2a3040;
    --text: #e8ecf4;
    --dim: #8b93a7;
    --dimmer: #5b6376;
    --accent: #4ade80;
    --accent-deep: #1c3b2a;
    --accent-edge: #2f6b48;
    --warn: #fbbf24;
    --warn-deep: #3a2f14;
    --danger: #f87171;
    --danger-deep: #3a1d1d;
    --r: 16px;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
    -webkit-user-select: none; user-select: none;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------------- header ---------------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(15,17,21,.9);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  }
  .navrow { display: flex; align-items: center; gap: 4px; }
  .arrow, .menubtn {
    width: 42px; height: 42px; flex: 0 0 42px; border-radius: 11px;
    display: grid; place-items: center; color: var(--dim); font-size: 21px;
  }
  .arrow:active, .menubtn:active { background: var(--card-hi); }
  .arrow[disabled] { opacity: .22; }
  .daylabel { flex: 1; text-align: center; min-width: 0; position: relative; }
  .daylabel .big { font-size: 18px; font-weight: 650; letter-spacing: -.2px; }
  .daylabel .small { font-size: 11.5px; color: var(--dim); margin-top: 1px; border-bottom: 1px dotted var(--dimmer); display: inline-block; padding-bottom: 1px; }
  /* Transparent native date input laid over the label. Tapping the date opens
     the phone's own picker, so any past day is one hop away instead of a run
     of arrow taps - which matters after a stretch offline. */
  .daylabel input[type=date] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; padding: 0; background: none;
    -webkit-appearance: none; appearance: none;
  }

  /* Loud on purpose. Demo figures that get mistaken for real ones would be
     worse than no demo at all. */
  .demobar {
    display: none; width: 100%; margin-top: 10px;
    background: var(--danger-deep); border: 1px solid #6b3030; color: var(--danger);
    border-radius: 11px; padding: 9px 12px; font-size: 12.5px; font-weight: 560;
    text-align: center;
  }
  .demobar.on { display: block; }

  .banks { display: flex; gap: 6px; margin-top: 10px; }
  .bank {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 11px; padding: 7px 4px; text-align: center;
  }
  .bank b { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.3px; }
  .bank span { display: block; font-size: 10px; color: var(--dim); margin-top: 1px; letter-spacing: .3px; }
  .bank.low b { color: var(--warn); }

  /* ---------------- cards ---------------- */
  main { padding: 12px; display: flex; flex-direction: column; gap: 9px; }

  .card {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); padding: 12px;
  }
  .card.ok   { background: var(--accent-deep); border-color: var(--accent-edge); }
  .card.warn { background: var(--warn-deep); border-color: #5a4a1c; }
  .card.miss { background: var(--danger-deep); border-color: #6b3030; }
  .card.pend { opacity: .55; }

  .tick {
    width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%;
    border: 2px solid var(--line); display: grid; place-items: center;
    font-size: 15px; font-weight: 700; color: var(--dimmer);
  }
  .card.ok .tick   { background: var(--accent); border-color: var(--accent); color: #0b2718; }
  .card.warn .tick { background: var(--warn); border-color: var(--warn); color: #2e2408; }
  .card.miss .tick { background: var(--danger); border-color: var(--danger); color: #2a0f0f; }
  .tick:active { transform: scale(.93); }

  .body { flex: 1; min-width: 0; }
  .name { font-size: 16.5px; font-weight: 620; letter-spacing: -.1px; }
  .meta { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .card.ok .meta { color: #9fd9b8; }
  .card.warn .meta { color: #d9c48a; }
  .card.miss .meta { color: #e5a1a1; }

  .streak { flex: 0 0 auto; text-align: right; }
  .streak b { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.3px; }
  .streak span { display: block; font-size: 10px; color: var(--dim); margin-top: 1px; }

  /* ---------------- sheets ---------------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.62); display: none; align-items: flex-end; }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%; background: var(--card);
    border-radius: 20px 20px 0 0; border-top: 1px solid var(--line);
    padding: 8px 14px calc(18px + env(safe-area-inset-bottom));
    animation: up .2s ease; max-height: 90dvh; overflow-y: auto;
  }
  @keyframes up { from { transform: translateY(100%); } }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 14px; }
  .sheet h3 { font-size: 17px; font-weight: 650; margin-bottom: 3px; }
  .sheet .sub { font-size: 12.5px; color: var(--dim); margin-bottom: 14px; }

  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 6px; }
  input[type=text], input[type=number], input[type=time] {
    width: 100%; height: 50px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--line);
    color: var(--text); font-size: 16px; padding: 0 14px; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: var(--accent); }

  select {
    width: 100%; height: 50px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--line);
    color: var(--text); font-size: 16px; padding: 0 40px 0 14px; outline: none;
    -webkit-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b93a7' stroke-width='2.5' stroke-linecap='round'><polyline points='6,9 12,15 18,9'/></svg>");
    background-repeat: no-repeat; background-position: right 13px center; background-size: 18px;
  }
  select:focus { border-color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 11px 13px; border-radius: 11px; font-size: 14px; font-weight: 560;
    background: var(--bg); border: 1px solid var(--line); color: var(--dim);
    min-width: 46px; text-align: center;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #0b2718; }
  .chip.u  { background: var(--warn); border-color: var(--warn); color: #2e2408; }
  .chip.uu { background: #e08a2e; border-color: #e08a2e; color: #2e1c08; }
  .chip.U  { background: var(--danger); border-color: var(--danger); color: #2a0f0f; }

  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 50px; height: 50px; border-radius: 12px; background: var(--card-hi);
    border: 1px solid var(--line); font-size: 22px; font-weight: 600;
  }
  .stepper button:active { background: var(--line); }
  .stepper .val { flex: 1; text-align: center; font-size: 20px; font-weight: 650; }

  .btns { display: flex; gap: 9px; margin-top: 6px; }
  .btn { flex: 1; height: 50px; border-radius: 12px; font-size: 15.5px; font-weight: 580; display: grid; place-items: center; }
  .btn.ghost { background: var(--card-hi); }
  .btn.go { background: var(--accent); color: #0b2718; font-weight: 650; }
  .btn.warn { background: var(--warn-deep); color: var(--warn); }
  .btn.danger { background: var(--danger-deep); color: var(--danger); }

  .note { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin: 10px 0 14px; }
  .note b { color: var(--text); font-weight: 600; }
  .warnbox { background: var(--warn-deep); border: 1px solid #5a4a1c; color: var(--warn); border-radius: 11px; padding: 11px 13px; font-size: 13px; line-height: 1.45; margin-bottom: 14px; }

  /* streak history */
  .srow {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 12px; border-radius: 12px; background: var(--bg);
    border: 1px solid var(--line); margin-bottom: 8px;
  }
  .srow:active { background: var(--card-hi); }
  .srow .sn { flex: 1; min-width: 0; }
  .srow .sn b { display: block; font-size: 15.5px; font-weight: 620; }
  .srow .sn small { display: block; font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  .srow .sv { text-align: right; flex: 0 0 auto; }
  .srow .sv b { display: block; font-size: 16px; font-weight: 650; }
  .srow .sv small { display: block; font-size: 10px; color: var(--dim); }

  .seg {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 10px 12px; border-radius: 10px; background: var(--bg);
    border: 1px solid var(--line); margin-bottom: 7px; font-size: 13.5px;
  }
  .seg.cur { border-color: var(--accent-edge); background: var(--accent-deep); }
  .seg .sd { color: var(--dim); font-size: 12px; }
  .seg.cur .sd { color: #9fd9b8; }
  .seg b { font-weight: 650; white-space: nowrap; }

  .row { display: flex; align-items: center; gap: 12px; padding: 14px 10px; border-radius: 11px; width: 100%; font-size: 16px; text-align: left; }
  .row:active { background: var(--card-hi); }
  .row .ic { width: 20px; text-align: center; }
  .row small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }

  textarea {
    width: 100%; height: 38dvh; border-radius: 12px; background: var(--bg);
    border: 1px solid var(--line); color: var(--dim);
    font: 400 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 11px; outline: none; resize: none;
    -webkit-user-select: text; user-select: text;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translate(-50%, 14px); z-index: 90;
    background: var(--card-hi); border: 1px solid var(--line);
    padding: 11px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: all .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header>
  <div class="navrow">
    <button class="arrow" id="prev" aria-label="Previous day">&lsaquo;</button>
    <div class="daylabel">
      <div class="big" id="dayBig">Today</div>
      <div class="small" id="daySmall"></div>
      <input type="date" id="datePick" aria-label="Jump to a day">
    </div>
    <button class="arrow" id="next" aria-label="Next day">&rsaquo;</button>
    <button class="menubtn" id="menu" aria-label="Menu">&#8943;</button>
  </div>
  <button class="demobar" id="demobar">SAMPLE DATA &mdash; tap to wipe and start clean</button>
  <div class="banks" id="banks"></div>
</header>

<main id="list"></main>

<div class="overlay" id="ovSheet"><div class="sheet" id="sheet"></div></div>

<div class="overlay" id="ovMenu">
  <div class="sheet">
    <div class="grab"></div>
    <button class="row" id="mExport"><span class="ic">&#8599;</span><span>Export for Claude<small>Copy history to paste into a session</small></span></button>
    <button class="row" id="mStreaks"><span class="ic">&#9201;</span><span>Streaks<small>Current, best, and every run so far</small></span></button>
    <button class="row" id="mStarts"><span class="ic">&#9998;</span><span>Start dates<small>When each streak began</small></span></button>
    <button class="row" id="mDemo"><span class="ic">&#9781;</span><span>Load sample data<small>A month of made-up entries to play with</small></span></button>
    <button class="row" id="mWipe"><span class="ic">&#10005;</span><span>Wipe everything<small>Back to empty, with your real start dates</small></span></button>
    <button class="row" id="mAbout"><span class="ic">&#9432;</span><span>About<small>How this stores your data</small></span></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ==========================================================================
     Habits are referred to by acronym only, here and everywhere else in this
     repo. What they stand for is deliberately not written down in code that
     gets published - that lives in HEALTH.md on the machine, not on the web.
     ========================================================================== */

  var APP_VERSION = 'v15';

  /* Adding ?sandbox to the address gives a completely separate practice copy:
     its own storage, seeded with sample entries, which the real tracking can
     never see and which can never overwrite it. Testing a system meant to hold
     multi-year streaks against the same store that holds them is not worth the
     risk of one wrong tap. */
  var SANDBOX = /[?&]sandbox\b/i.test(location.search);
  var KEY = SANDBOX ? 'habits.sandbox' : 'habits.v2';

  // kind: 'do'      - tapping records that it happened
  //       'avoid'   - clean by default; tapping records that it did NOT hold
  // H S J B W R F N - the order they are worked through in a day.
  var HABITS = [
    { id: 'H2Only',   kind: 'avoid' },
    { id: 'STOP',     kind: 'avoid' },
    { id: 'JUST8',    kind: 'do'    },
    { id: 'BED',      kind: 'do'    },
    { id: 'WERKOUTS', kind: 'do'    },
    { id: 'RAK',      kind: 'do'    },
    { id: 'FIT',      kind: 'avoid' },
    { id: 'NOTE',     kind: 'do'    }
  ];

  var WERK  = ['W', 'E', 'R', 'K', 'O', 'U', 'T', 'S'];
  var FITB  = ['M', 'T', 'W', 'TH', 'F'];

  /* A full session is the target and also the ceiling - going longer is common
     but not worth tracking, so the stepper opens at a full one and is walked
     DOWN for a partial rather than up from zero. The overwhelming majority of
     days need no adjustment at all. */
  /* R's shortlist. Only the acts actually named are seeded - guessing at
     what someone does for others is presumptuous - and anything typed as
     Other joins the list, so it fits the real pattern within a week or two. */
  var RAK_SEED = [
    'Held the door for someone',
    'Picked up trash',
    'Paid for someone'
  ];
  var RAK_MAX = 12;

  function rakList() {
    if (!state.rakList || !state.rakList.length) state.rakList = RAK_SEED.slice();
    return state.rakList;
  }
  function rakRemember(text) {
    var t = (text || '').trim();
    if (!t) return;
    var list = rakList();
    var i = list.indexOf(t);
    if (i !== -1) list.splice(i, 1);
    list.unshift(t);                       // most recently used floats up
    if (list.length > RAK_MAX) list.length = RAK_MAX;
  }

  var WERK_FULL = 31;
  function werkMin(e) { return (e && typeof e.min === 'number') ? e.min : WERK_FULL; }

  /* ---------------- FIT sizing ----------------
     Each behaviour is off, -u, -uu or -U. The day's whole allowance is two
     lowercase units or one uppercase Unit, so -uu on one thing spends it all
     just as surely as -u on two things does.                                 */
  var FIT_CYCLE = ['', 'u', 'uu', 'U'];
  function fitNext(v) { return FIT_CYCLE[(FIT_CYCLE.indexOf(v || '') + 1) % FIT_CYCLE.length]; }
  function fitWeight(v) { return v === 'u' ? 1 : v === 'uu' ? 2 : 0; }

  function fitOver(items) {
    var small = 0, big = 0;
    Object.keys(items || {}).forEach(function (k) {
      if (items[k] === 'U') big++; else small += fitWeight(items[k]);
    });
    // A Unit takes the whole day; lowercase units run out after two.
    return { small: small, big: big, over: (big > 1) || (big === 1 && small > 0) || (small > 2) };
  }

  /* M is stamped rather than judged by eye: the time the phone goes down
     decides its own size. Under half an hour past 12 is -u, under the
     hour -uu, an hour or more is -U and starts costing 8ANK points at one an
     hour - M being the only behaviour allowed to reach for them. */
  function bedMinutesOver(hm) {
    if (!hm) return null;
    var p = hm.split(':'), h = +p[0], m = +p[1];
    if (h >= 12) return 0;                 // phone down before 12
    return h * 60 + m;
  }
  function bedGrade(mins) {
    if (mins === null || mins <= 0) return '';
    if (mins < 30) return 'u';
    if (mins < 60) return 'uu';
    return 'U';
  }
  function bedPoints(mins) {
    return (mins !== null && mins >= 60) ? Math.ceil(mins / 60) : 0;
  }

  var DEFAULT_STARTS = {
    BED: '2018-09-15', H2Only: '2019-01-02', WERKOUTS: '2019-01-02', NOTE: '2024-08-17',
    RAK: '2026-08-30', JUST8: '2026-08-30', STOP: '2026-08-30', FIT: '2026-08-30'
  };

  var state = { starts: {}, days: {} };

  // Cached result of the JUST8 pass; cleared on every write.
  var _j8 = null;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var p = JSON.parse(raw);
        state.starts = p.starts || {};
        state.days   = p.days   || {};
        state.demo   = !!p.demo;
        if (Array.isArray(p.rakList)) state.rakList = p.rakList;
      }
    } catch (e) { /* blocked storage: run from memory this session */ }
    HABITS.forEach(function (h) {
      if (!state.starts[h.id]) state.starts[h.id] = DEFAULT_STARTS[h.id];
    });
  }
  function save() {
    _j8 = null;                                  // any write can move the banks
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Could not save - storage is blocked'); }
  }

  /* ---------------- dates ---------------- */
  function key(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function parse(s) { return new Date(s + 'T00:00:00'); }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function startOfDay(d) { var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); return x; }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }

  var today   = startOfDay(new Date());
  var viewing = startOfDay(new Date());

  function labelFor(d) {
    var n = daysBetween(today, d);
    if (n === 0) return 'Today';
    if (n === -1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { weekday: 'long' });
  }

  /* ---------------- day entries ---------------- */
  function entry(dk, id, make) {
    var day = state.days[dk];
    if (!day) { if (!make) return null; day = state.days[dk] = {}; }
    if (!day[id]) { if (!make) return null; day[id] = {}; }
    return day[id];
  }
  function get(dk, id) { return entry(dk, id, false); }

  function prune(dk, id) {
    var day = state.days[dk];
    if (!day || !day[id]) return;
    var e = day[id], empty = true;
    for (var k in e) {
      var v = e[k];
      if (v === false || v === null || v === undefined || v === '' || v === 0) continue;
      if (Array.isArray(v) && v.length === 0) continue;
      empty = false; break;
    }
    if (empty) delete day[id];
    if (Object.keys(day).length === 0) delete state.days[dk];
  }

  /* ---------------- streaks ----------------
     A streak runs from its start date and is broken ONLY by an explicitly
     recorded miss. Forgetting to open the app on a Tuesday does nothing - the
     alternative would let a silent gap wipe out a streak years long.          */
  function missedOn(dk, id) {
    var e = get(dk, id);
    if (!e) return false;
    if (id === 'STOP') return !!e.miss;          // set when the bank goes below zero
    if (id === 'H2Only') return !!e.broke;       // the tap itself is the break
    if (id === 'JUST8') return !!e.miss || !!e.bankMiss;  // by hand, or both banks spent
    return !!e.miss;
  }

  function lastMiss(id) {
    var start = parse(state.starts[id]);
    var probe = today;
    while (daysBetween(start, probe) >= 0) {
      if (missedOn(key(probe), id)) return probe;
      probe = addDays(probe, -1);
    }
    return null;
  }

  /* Every run this habit has ever had, worked out from the recorded misses.
     The original start date is never overwritten when something breaks - a
     break opens a new run alongside the old ones rather than erasing when the
     whole thing began. Eight years of history should survive one bad Tuesday. */
  function streakSegments(id) {
    var out = [];
    var start = parse(state.starts[id]);
    var n = daysBetween(start, today);
    if (n < 0) return out;

    var runStart = start, d = start;
    for (var i = 0; i <= n; i++) {
      if (missedOn(key(d), id)) {
        var last = addDays(d, -1);
        if (daysBetween(runStart, last) >= 0) {
          out.push({ from: key(runStart), to: key(last), days: daysBetween(runStart, last) + 1 });
        }
        runStart = addDays(d, 1);
      }
      d = addDays(d, 1);
    }
    if (daysBetween(runStart, today) >= 0) {
      out.push({ from: key(runStart), to: key(today), days: daysBetween(runStart, today) + 1, current: true });
    }
    return out;
  }

  function streak(id) {
    var start = parse(state.starts[id]);
    if (daysBetween(start, today) < 0) return -1;         // hasn't begun yet
    var m = lastMiss(id);
    return m ? daysBetween(m, today) : daysBetween(start, today) + 1;
  }

  /* ---------------- JUST8 points ---------------- */

  function windowHours(e) {
    if (!e || !e.eatStart || !e.eatEnd) return 0;
    var a = e.eatStart.split(':'), b = e.eatEnd.split(':');
    var m1 = (+a[0]) * 60 + (+a[1]), m2 = (+b[0]) * 60 + (+b[1]);
    if (m2 < m1) m2 += 1440;                       // ran past the end of the day
    return (m2 - m1) / 60;
  }

  // Cups cost a point per 3 cups; CupS cost 3 points a cup; every
  // hour past 8 costs a point, chargeable in quarter-point 15-minute slices.
  function j8DayCost(e) {
    if (!e) return 0;
    var c = 0;
    if (e.cups)  c += e.cups / 3;
    if (e.cupS)  c += e.cupS * 3;
    var h = windowHours(e);
    if (h > 8) c += Math.round((h - 8) * 4) / 4;
    return Math.round(c * 100) / 100;
  }

  /* One pass produces the 8ANK, the TH8NK and every JUST8 miss together, so
     the three can never drift apart.

     Earning: a point a day, plus a second one each Sunday standing in for
     Zunday - the microsecond eighth day - which makes eight a week. The TH8NK
     takes 3 a week on the same rhythm.

     Deposits: 3 out of the 8ANK become 4 in the TH8NK - a point of interest for
     putting it away. It still only ever comes back at the one-third rate, so
     the round trip loses value; the reason to do it is to have a reserve when
     travelling, not to gain points.

     Rescue: if the 8ANK falls below zero the TH8NK tops it straight back up at
     the one-third rate, so covering a 1 point shortfall spends 3. But the
     TH8NK is only reachable on a day marked Travel or Holiday - on an ordinary
     day there is nothing to fall back on, and going below zero is a miss.     */
  var HOLIDAYS_PER_YEAR = 8;

  function j8() {
    if (_j8) return _j8;
    var res = { bank: 0, thank: 0, autoPulled: 0, misses: {}, holidaysUsed: {}, depAvail: {}, open: {} };
    var start = parse(state.starts.JUST8);
    var n = daysBetween(start, today);
    if (n < 0) { _j8 = res; return res; }

    var bank = 0, th = 0, d = start;
    for (var i = 0; i <= n; i++) {
      var dk = key(d);
      var e = get(dk, 'JUST8');
      var yr = d.getFullYear();

      bank += 1;
      if (d.getDay() === 0) bank += 1;            // Sunday carries Zunday's point
      if (i % 7 === 0) th += 3;                   // the weekly TH8NK grant

      /* Only a Travel or Holiday day opens the TH8NK, and holidays are capped
         per calendar year - the ninth one of a year simply does not count. */
      var open = false;
      if (e && e.trav === 'T') open = true;
      else if (e && e.trav === 'H') {
        res.holidaysUsed[yr] = (res.holidaysUsed[yr] || 0) + 1;
        open = res.holidaysUsed[yr] <= HOLIDAYS_PER_YEAR;
      }
      res.open[dk] = open;   // a capped holiday is marked but still shut

      if (e) bank -= j8DayCost(e);
      var f = get(dk, 'FIT');
      if (f && f.mPts) bank -= f.mPts;            // M covered from the 8ANK

      if (e && e.thankDep) {                      // 3 out of the 8ANK, 4 into the TH8NK
        var dep = Math.floor(Math.min(e.thankDep, Math.max(0, bank)) / 3) * 3;
        if (dep > 0) { bank -= dep; th += (dep / 3) * 4; }
      }

      /* What is still spare that day, so the deposit button can be judged
         against the balance it will actually be charged to rather than the
         closing total - those differ, and the gap made deposits silently
         vanish. */
      res.depAvail[dk] = Math.max(0, Math.round(bank * 100) / 100);

      if (e && e.thankPull && open) {             // a deliberate pull, that day
        var p = Math.min(e.thankPull, th);
        th -= p; bank += p / 3;
      }

      if (bank < 0 && th > 0 && open) {
        var pull = Math.min(-bank * 3, th);
        th -= pull; bank += pull / 3;
        res.autoPulled += pull;
      }

      res.misses[dk] = (bank < 0);                // nothing left to reach for
      d = addDays(d, 1);
    }

    res.bank       = Math.round(bank * 100) / 100;
    res.thank      = Math.round(th * 100) / 100;
    res.autoPulled = Math.round(res.autoPulled * 100) / 100;
    _j8 = res;
    return res;
  }

  function bank8() { return j8().bank; }
  function thank()  { return j8().thank; }

  function holidayNote() {
    var used = j8().holidaysUsed[today.getFullYear()] || 0;
    var left = HOLIDAYS_PER_YEAR - used;
    return left > 0
      ? left + ' of ' + HOLIDAYS_PER_YEAR + ' holidays left this year'
      : 'All ' + HOLIDAYS_PER_YEAR + ' holidays used this year - further ones will not open the TH8NK';
  }

  /* Write the computed misses back onto the days they happened, so the streak
     breaks on the right date instead of only showing up as a total. */
  function refreshJ8Misses() {
    var m = j8().misses, changed = false;
    Object.keys(m).forEach(function (dk) {
      var e = get(dk, 'JUST8');
      if (m[dk] === !!(e && e.bankMiss)) return;
      entry(dk, 'JUST8', true).bankMiss = m[dk];
      prune(dk, 'JUST8');
      changed = true;
    });
    if (changed) save();
  }

  /* ---------------- STOP bank ----------------
     Every day without a slip banks a minute; a slip spends the minutes it
     cost.                                                                    */
  function stopBank() {
    var start = parse(state.starts.STOP);
    var n = daysBetween(start, today);
    if (n < 0) return 0;
    var bank = 0, d = start;
    for (var i = 0; i <= n; i++) {
      var e = get(key(d), 'STOP');
      if (e && e.slip) bank -= (e.min || 0); else bank += 1;
      d = addDays(d, 1);
    }
    return bank;
  }

  /* Recompute which STOP days pushed the bank negative, so the streak breaks
     on the day it actually happened rather than only showing up as a total. */
  function refreshStopMisses() {
    var start = parse(state.starts.STOP);
    var n = daysBetween(start, today);
    if (n < 0) return;
    var bank = 0, d = start, changed = false;
    for (var i = 0; i <= n; i++) {
      var dk = key(d), e = get(dk, 'STOP');
      if (e && e.slip) bank -= (e.min || 0); else bank += 1;
      var isMiss = bank < 0;
      if (isMiss !== !!(e && e.miss)) {
        var t = entry(dk, 'STOP', true);
        t.miss = isMiss;
        prune(dk, 'STOP');
        changed = true;
      }
      d = addDays(d, 1);
    }
    if (changed) save();
  }

  /* ---------------- render ---------------- */
  var listEl = document.getElementById('list');

  function fmt(n) {
    var r = Math.round(n * 100) / 100;
    return (r % 1 === 0) ? String(r) : String(r);
  }

  /* Three states, so a glance down the list is readable:
       ok    - clean, or done as intended
       warn  - recorded something that cost you, but the streak still holds
       miss  - streak broken                                                  */
  function cardState(dk, id) {
    var e = get(dk, id);
    if (daysBetween(parse(state.starts[id]), parse(dk)) < 0) return 'pend';
    if (missedOn(dk, id)) return 'miss';
    if (!e) return '';

    switch (id) {
      case 'H2Only':   return e.logged ? 'ok' : '';
      case 'STOP':     return e.slip ? 'warn' : (e.logged ? 'ok' : '');
      case 'FIT':      return (e.items && Object.keys(e.items).length) ? 'warn' : (e.logged ? 'ok' : '');
      case 'JUST8':    return (e.eatStart && e.eatEnd) ? 'ok' : (e.eatStart || e.cups || e.cupS ? 'warn' : '');
      case 'WERKOUTS': return e.done ? 'ok' : (e.min ? 'warn' : '');
      default:         return e.done ? 'ok' : '';
    }
  }

  /* The card carries the name and the streak, and otherwise stays quiet.
     Status lines - "Held", "Made", "Clean" - restated on every row what the
     colour already said, and made a list of eight look like a list of chores.
     The only thing worth the second line is something actually written down:
     the act, or the person. */
  function summary(dk, id) {
    var e = get(dk, id);
    if (daysBetween(parse(state.starts[id]), parse(dk)) < 0) {
      return 'starts ' + parse(state.starts[id]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    if (missedOn(dk, id)) return 'Missed';
    if (!e) return '';
    if (id === 'RAK')  return e.note || '';
    if (id === 'NOTE') return e.who || '';
    return '';
  }

  function render() {
    refreshStopMisses();
    refreshJ8Misses();
    var dk = key(viewing);

    document.getElementById('dayBig').textContent = labelFor(viewing);
    document.getElementById('daySmall').textContent =
      viewing.toLocaleDateString(undefined, { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById('next').disabled = (viewing >= today);

    // Never offer a day before the oldest streak began, or a day in the future.
    var dp = document.getElementById('datePick');
    var earliest = HABITS.map(function (h) { return state.starts[h.id]; }).sort()[0];
    dp.min = earliest;
    dp.max = key(today);
    dp.value = key(viewing);

    var db = document.getElementById('demobar');
    db.classList.toggle('on', SANDBOX || !!state.demo);
    db.innerHTML = SANDBOX
      ? 'SANDBOX &mdash; practice only, none of this is real &middot; tap to reset'
      : 'SAMPLE DATA &mdash; tap to wipe and start clean';

    var b8 = bank8(), th = thank(), sb = stopBank();
    document.getElementById('banks').innerHTML =
      '<div class="bank' + (b8 < 3 ? ' low' : '') + '"><b>' + fmt(b8) + '</b><span>8ANK</span></div>' +
      '<div class="bank"><b>' + fmt(th) + '</b><span>TH8NK</span></div>' +
      '<div class="bank' + (sb < 3 ? ' low' : '') + '"><b>' + fmt(sb) + '</b><span>STOP MIN</span></div>';

    listEl.innerHTML = '';
    HABITS.forEach(function (h) {
      var st = cardState(dk, h.id);
      var s  = streak(h.id);
      var el = document.createElement('div');
      el.className = 'card' + (st ? ' ' + st : '');
      el.innerHTML =
        '<div class="tick" data-tick="1">' + (st === 'miss' ? '&#10005;' : st === 'ok' ? '&#10003;' : st === 'warn' ? '&#33;' : '') + '</div>' +
        '<div class="body"><div class="name"></div><div class="meta"></div></div>' +
        '<div class="streak"><b>' + (s < 0 ? '-' : s.toLocaleString()) + '</b><span>' + (s < 0 ? 'soon' : 'days') + '</span></div>';
      el.querySelector('.name').textContent = h.id;
      var sub = summary(dk, h.id);
      var metaEl = el.querySelector('.meta');
      metaEl.textContent = sub;
      metaEl.style.display = sub ? '' : 'none';   // no empty line pushing the name off centre

      el.querySelector('[data-tick]').addEventListener('click', function (ev) {
        ev.stopPropagation();
        quickTap(dk, h);
      });
      el.addEventListener('click', function () { openSheet(dk, h.id); });
      listEl.appendChild(el);
    });
  }

  /* The tick is the one-tap path for the simple cases; anything that needs a
     number or a name opens its sheet instead of guessing. */
  function quickTap(dk, h) {
    if (daysBetween(parse(state.starts[h.id]), parse(dk)) < 0) { toast(h.id + ' has not started yet'); return; }
    if (h.id === 'BED' || h.id === 'RAK' || h.id === 'NOTE' || h.id === 'WERKOUTS') {
      var e = entry(dk, h.id, true);
      e.done = !e.done;
      if (!e.done) e.miss = false;
      // The tick is the "did the whole thing" shortcut; the sheet is where a
      // partial gets walked down.
      if (h.id === 'WERKOUTS') e.min = e.done ? WERK_FULL : 0;
      prune(dk, h.id); save(); render();
      if (h.id === 'RAK' && e.done && !e.note) openSheet(dk, 'RAK');
      if (h.id === 'NOTE' && e.done && !e.who) openSheet(dk, 'NOTE');
      return;
    }
    if (h.id === 'H2Only' || h.id === 'STOP' || h.id === 'FIT') {
      var t = entry(dk, h.id, true);
      t.logged = !t.logged;
      prune(dk, h.id); save(); render();
      return;
    }
    openSheet(dk, h.id);
  }

  /* ---------------- sheets ---------------- */
  var sheetEl = document.getElementById('sheet');
  function openOv(id) { document.getElementById(id).classList.add('open'); }
  function closeOv(id) { document.getElementById(id).classList.remove('open'); }
  Array.prototype.forEach.call(document.querySelectorAll('.overlay'), function (o) {
    o.addEventListener('click', function (e) { if (e.target === o) o.classList.remove('open'); });
  });

  var toastT;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('show'); }, 1900);
  }

  function head(title, sub) {
    return '<div class="grab"></div><h3>' + title + '</h3><div class="sub">' + sub + '</div>';
  }
  function missBtn() {
    return '<button class="btn danger" data-act="miss">Mark missed</button>';
  }
  function doneBtn() {
    return '<button class="btn go" data-act="close">Done</button>';
  }

  function openSheet(dk, id) {
    if (daysBetween(parse(state.starts[id]), parse(dk)) < 0) {
      toast(id + ' starts ' + state.starts[id]); return;
    }
    var e = entry(dk, id, true);
    var when = parse(dk).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    var html = '';

    if (id === 'BED') {
      html = head('BED', when) +
        '<div class="btns" style="margin-bottom:10px">' +
          '<button class="btn ' + (e.done ? 'go' : 'ghost') + '" data-act="done">' + (e.done ? 'Made &#10003;' : 'Mark made') + '</button>' +
        '</div>' + '<div class="btns">' + missBtn() + doneBtn() + '</div>';
    }

    else if (id === 'H2Only') {
      html = head('H2Only', when) +
        '<div class="note">Clean unless you say otherwise. Only mark it if the streak actually broke.</div>' +
        '<div class="btns" style="margin-bottom:10px">' +
          '<button class="btn ' + (!e.broke ? 'go' : 'ghost') + '" data-act="held">Held</button>' +
          '<button class="btn ' + (e.broke ? 'danger' : 'ghost') + '" data-act="broke">Broke it</button>' +
        '</div>' + '<div class="btns">' + doneBtn() + '</div>';
    }

    else if (id === 'RAK' || id === 'NOTE') {
      var isRak = (id === 'RAK');
      var label = isRak ? 'What you did' : 'Who you wrote to';
      var val   = isRak ? (e.note || '') : (e.who || '');
      var esc   = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };

      var picker = '';
      if (isRak) {
        var list = rakList();
        var known = list.indexOf(val) !== -1;
        /* The value decides the selection, not the flag that opened the box.
           Once something typed has joined the list it is a normal choice, so
           it shows as picked rather than stranding the box open under it. */
        var mode  = known ? val : ((val || e.rakOther) ? '__other' : '');
        picker =
          '<div class="field"><label>' + label + '</label>' +
            '<select id="rakPick">' +
              '<option value=""' + (mode === '' ? ' selected' : '') + '>Choose one&hellip;</option>' +
              list.map(function (a) {
                return '<option value="' + esc(a) + '"' + (mode === a ? ' selected' : '') + '>' + esc(a) + '</option>';
              }).join('') +
              '<option value="__other"' + (mode === '__other' ? ' selected' : '') + '>Something else&hellip;</option>' +
            '</select>' +
          '</div>' +
          (mode === '__other'
            ? '<div class="field"><input type="text" id="fText" value="' + esc(val) +
              '" placeholder="what you did" autocomplete="off" enterkeyhint="done"></div>'
            : '');
      } else {
        picker =
          '<div class="field"><label>' + label + '</label>' +
            '<input type="text" id="fText" value="' + esc(val) + '" placeholder="name" autocomplete="off" enterkeyhint="done"></div>';
      }

      html = head(id, when) +
        '<div class="btns" style="margin-bottom:14px">' +
          '<button class="btn ' + (e.done ? 'go' : 'ghost') + '" data-act="done">' + (e.done ? 'Done &#10003;' : 'Mark done') + '</button>' +
        '</div>' +
        picker +
        '<div class="btns">' + missBtn() + doneBtn() + '</div>';
    }

    else if (id === 'WERKOUTS') {
      var types = e.types || [];
      var wm = werkMin(e);
      html = head('WERKOUTS', when) +
        '<div class="field"><label>Minutes &mdash; starts at a full ' + WERK_FULL + '</label>' +
          '<div class="stepper">' +
            '<button data-act="min-">&minus;</button>' +
            '<div class="val" id="minVal">' + wm + (wm >= WERK_FULL ? '' : ' &mdash; partial') + '</div>' +
            '<button data-act="min+">+</button>' +
          '</div></div>' +
        '<div class="field"><label>Which ones</label><div class="chips">' +
          WERK.map(function (w) {
            return '<button class="chip' + (types.indexOf(w) !== -1 ? ' on' : '') + '" data-werk="' + w + '">' + w + '</button>';
          }).join('') +
        '</div></div>' +
        '<div class="btns">' + missBtn() + doneBtn() + '</div>';
    }

    else if (id === 'STOP') {
      html = head('STOP', when) +
        '<div class="note">Bank right now: <b>' + fmt(stopBank()) + ' min</b>. A clean day adds one. The streak breaks only if the bank goes below zero.</div>' +
        '<div class="btns" style="margin-bottom:14px">' +
          '<button class="btn ' + (!e.slip ? 'go' : 'ghost') + '" data-act="clean">Clean</button>' +
          '<button class="btn ' + (e.slip ? 'danger' : 'ghost') + '" data-act="slip">Slipped</button>' +
        '</div>' +
        (e.slip ? '<div class="field"><label>Minutes it cost</label>' +
          '<div class="stepper">' +
            '<button data-act="smin-">&minus;</button>' +
            '<div class="val" id="sminVal">' + (e.min || 0) + '</div>' +
            '<button data-act="smin+">+</button>' +
          '</div></div>' : '') +
        '<div class="btns">' + doneBtn() + '</div>';
    }

    else if (id === 'FIT') {
      var items = e.items || {};
      var tally = fitOver(items);
      var mins = bedMinutesOver(e.bed);

      var bedLine;
      if (!e.bed) bedLine = 'Not stamped yet.';
      else if (mins <= 0) bedLine = 'Phone down at <b>' + e.bed + '</b> &mdash; nothing counted.';
      else bedLine = 'Phone down at <b>' + e.bed + '</b> &mdash; ' +
             (mins >= 60 ? Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : mins + ' min') +
             ' past 12, so <b>M-' + bedGrade(mins) + '</b>' +
             (bedPoints(mins) ? ' and <b>' + bedPoints(mins) + ' pt</b> from the 8ANK' : '') + '.';

      html = head('FIT', when) +
        '<div class="field"><label>Phone down for the night</label>' +
          '<div class="btns">' +
            '<button class="btn ' + (e.bed ? 'ghost' : 'go') + '" data-act="bed">' +
              (e.bed ? 'Stamped ' + e.bed + ' &mdash; tap to clear' : 'I am done with my phone') + '</button>' +
          '</div>' +
          '<div class="note" style="margin:8px 0 0">' + bedLine + '</div>' +
        '</div>' +
        '<div class="note">Tap a letter to cycle it: off &rarr; <b>-u</b> &rarr; <b>-uu</b> &rarr; <b>-U</b>. The day allows two <b>u</b>, or one <b>U</b>.</div>' +
        '<div class="field"><div class="chips">' +
          FITB.map(function (f) {
            var v = items[f] || '';
            return '<button class="chip' + (v ? ' ' + v : '') + '" data-fit="' + f + '">' + f + (v ? '-' + v : '') + '</button>';
          }).join('') +
        '</div></div>' +
        (tally.over
          ? '<div class="warnbox">Past the allowance &mdash; ' + tally.small + '&nbsp;u and ' + tally.big + '&nbsp;U. If that is right, mark it missed.</div>'
          : '') +
        '<div class="field"><label>Cover M from the 8ANK &mdash; 1 point an hour</label>' +
          '<div class="stepper">' +
            '<button data-act="mpts-">&minus;</button>' +
            '<div class="val" id="mptsVal">' + (e.mPts || 0) + ' pt</div>' +
            '<button data-act="mpts+">+</button>' +
          '</div></div>' +
        '<div class="btns">' + missBtn() + doneBtn() + '</div>';
    }

    else if (id === 'JUST8') {
      var h8 = windowHours(e);
      html = head('JUST8', when) +
        '<div class="note">8ANK: <b>' + fmt(bank8()) + '</b> &nbsp;&middot;&nbsp; TH8NK: <b>' + fmt(thank()) + '</b> &nbsp;&middot;&nbsp; today costs <b>' + fmt(j8DayCost(e)) + ' pt</b></div>' +
        (j8().autoPulled
          ? '<div class="warnbox">The TH8NK has automatically covered <b>' + fmt(j8().autoPulled) +
            '</b> so far, which reached the 8ANK as <b>' + fmt(j8().autoPulled / 3) + ' pt</b>. ' +
            'A day only counts as missed once both are spent.</div>'
          : '') +
        '<div class="field"><label>Eating window</label>' +
          '<div class="btns" style="margin-bottom:8px">' +
            '<button class="btn ' + (e.eatStart ? 'ghost' : 'go') + '" data-act="eatstart">' + (e.eatStart ? 'Started ' + e.eatStart : 'Start eating') + '</button>' +
            '<button class="btn ' + (e.eatEnd ? 'ghost' : (e.eatStart ? 'go' : 'ghost')) + '" data-act="eatend">' + (e.eatEnd ? 'Stopped ' + e.eatEnd : 'Stop eating') + '</button>' +
          '</div>' +
          (e.eatStart && e.eatEnd
            ? '<div class="note" style="margin:0">Window <b>' + fmt(Math.round(h8 * 4) / 4) + ' h</b>' + (h8 > 8 ? ' &mdash; ' + fmt(Math.round((h8 - 8) * 4) / 4) + ' over, costs ' + fmt(Math.round((h8 - 8) * 4) / 4) + ' pt' : ' &mdash; inside the window') + '</div>'
            : '') +
        '</div>' +
        '<div class="field"><label>Cups &mdash; 1 pt per 3 cups</label>' +
          '<div class="stepper">' +
            '<button data-act="cups-">&minus;</button>' +
            '<div class="val" id="cupsVal">' + fmt(e.cups || 0) + '</div>' +
            '<button data-act="cups+">+</button>' +
          '</div></div>' +
        '<div class="field"><label>CupS &mdash; 3 pt per cup</label>' +
          '<div class="stepper">' +
            '<button data-act="cupS-">&minus;</button>' +
            '<div class="val" id="cupSVal">' + fmt(e.cupS || 0) + '</div>' +
            '<button data-act="cupS+">+</button>' +
          '</div></div>' +
        '<div class="field"><label>The TH8NK only opens on a TH8NK day</label>' +
          '<div class="btns">' +
            '<button class="btn ' + (e.trav ? 'go' : 'ghost') + '" data-act="tday">' +
              (e.trav ? 'TH8NK day &#10003;' : 'Make it a TH8NK day') + '</button>' +
          '</div>' +
          (e.trav
            ? '<div class="btns" style="margin-top:9px">' +
                '<button class="btn ' + (e.trav === 'H' ? 'go' : 'ghost') + '" data-act="holi">' +
                  (e.trav === 'H' ? 'Holiday &#10003;' : 'It was a holiday') + '</button>' +
              '</div>' +
              '<div class="note" style="margin:8px 0 0">' + holidayNote() + '</div>'
            : '') +
        '</div>' +
        (j8().open[dk]
          ? '<div class="field"><label>Pull from TH8NK &mdash; arrives at a third (' + fmt(thank()) + ' there)</label>' +
              '<div class="btns"><button class="btn ghost" data-act="thank3">Pull 3 &rarr; +1 pt</button></div>' +
            '</div>'
          : '<div class="note">The TH8NK is shut today' +
            (e.trav === 'H' ? ' &mdash; this year\'s 8 holidays are already used' : '') +
            '. ' + (e.trav ? '' : 'Mark it a TH8NK day above to reach it. ') +
            'An 8ANK below zero is a miss while it stays shut.</div>') +
        '<div class="field"><label>Put 3 into the TH8NK &mdash; lands as 4' + (e.thankDep ? ' (' + e.thankDep + ' in today)' : '') +
          ' &middot; ' + fmt(j8().depAvail[dk] || 0) + ' spare today</label>' +
          '<div class="btns"><button class="btn ghost" data-act="dep3">Deposit 3 &rarr; +4</button></div>' +
        '</div>' +
        '<div class="btns">' + missBtn() + doneBtn() + '</div>';
    }

    sheetEl.innerHTML = html;
    wireSheet(dk, id);
    openOv('ovSheet');
  }

  function nowHM() {
    var d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function wireSheet(dk, id) {
    var e = entry(dk, id, true);

    function commit(reopen) {
      // Free-text fields are read back before anything is written away.
      var f = document.getElementById('fText');
      if (f) {
        if (id === 'RAK') {
          e.note = f.value.trim();
          rakRemember(e.note);
          if (e.note) { e.rakOther = false; e.done = true; }   // it is a listed choice now
        }
        else e.who = f.value.trim();
      }
      prune(dk, id); save(); render();
      if (reopen) openSheet(dk, id);
    }

    var pick = document.getElementById('rakPick');
    if (pick) {
      pick.addEventListener('change', function () {
        if (this.value === '__other') {
          e.rakOther = true;              // reveal the box, keep whatever is typed
          e.done = true;
          prune(dk, id); save(); render(); openSheet(dk, id);
          setTimeout(function () { var t = document.getElementById('fText'); if (t) t.focus(); }, 90);
          return;
        }
        e.rakOther = false;
        e.note = this.value;
        if (e.note) { e.done = true; rakRemember(e.note); }
        prune(dk, id); save(); render(); openSheet(dk, id);
      });
    }

    Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-act]'), function (b) {
      b.addEventListener('click', function () {
        var a = b.getAttribute('data-act');

        if (a === 'close') { commit(false); closeOv('ovSheet'); return; }
        if (a === 'miss')  {
          e.miss = true; e.done = false; commit(false); closeOv('ovSheet');
          // Name the day back, since a miss is often entered days after the fact.
          toast(id + ' missed on ' + parse(dk).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
          return;
        }
        if (a === 'done')  { e.done = !e.done; e.miss = false; commit(true); return; }
        if (a === 'held')  { e.broke = false; e.logged = true; commit(true); return; }
        if (a === 'broke') { e.broke = true;  e.logged = true; commit(true); return; }
        if (a === 'clean') { e.slip = false; e.min = 0; e.logged = true; commit(true); return; }
        if (a === 'slip')  { e.slip = true;  e.logged = true; commit(true); return; }

        if (a === 'min-')  { e.min = Math.max(0, werkMin(e) - 5);          e.done = (e.min >= WERK_FULL); commit(true); return; }
        if (a === 'min+')  { e.min = Math.min(WERK_FULL, werkMin(e) + 5); e.done = (e.min >= WERK_FULL); commit(true); return; }
        if (a === 'smin-') { e.min = Math.max(0, (e.min || 0) - 1); commit(true); return; }
        if (a === 'smin+') { e.min = (e.min || 0) + 1; commit(true); return; }
        if (a === 'mpts-') { e.mPts = Math.max(0, (e.mPts || 0) - 1); commit(true); return; }
        if (a === 'mpts+') { e.mPts = (e.mPts || 0) + 1; commit(true); return; }

        if (a === 'cups-') { e.cups = Math.max(0, Math.round(((e.cups || 0) - 0.25) * 100) / 100); commit(true); return; }
        if (a === 'cups+') { e.cups = Math.round(((e.cups || 0) + 0.25) * 100) / 100; commit(true); return; }
        if (a === 'cupS-') { e.cupS = Math.max(0, Math.round(((e.cupS || 0) - 0.25) * 100) / 100); commit(true); return; }
        if (a === 'cupS+') { e.cupS = Math.round(((e.cupS || 0) + 0.25) * 100) / 100; commit(true); return; }

        /* Stamping the time grades M by itself and sets the points it costs.
           Both stay adjustable below - the clock reports, it does not rule. */
        if (a === 'bed') {
          if (e.bed) { e.bed = ''; if (e.items) delete e.items.M; e.mPts = 0; commit(true); return; }
          e.bed = nowHM();
          var mv = bedMinutesOver(e.bed);
          var g = bedGrade(mv);
          e.items = e.items || {};
          if (g) e.items.M = g; else delete e.items.M;
          e.mPts = bedPoints(mv);
          e.logged = true;
          commit(true);
          toast(g ? 'M-' + g + ' recorded' : 'Nothing counted');
          return;
        }

        if (a === 'eatstart') { e.eatStart = e.eatStart ? '' : nowHM(); commit(true); return; }
        if (a === 'eatend')   { e.eatEnd   = e.eatEnd   ? '' : nowHM(); commit(true); return; }

        // 'T' is a plain TH8NK day; 'H' is one that also spends a holiday.
        if (a === 'tday') { e.trav = e.trav ? '' : 'T'; commit(true); return; }
        if (a === 'holi') { e.trav = (e.trav === 'H') ? 'T' : 'H'; commit(true); return; }

        if (a === 'thank3') {
          if (!j8().open[dk]) { toast(e.trav ? 'This year\'s 8 holidays are used' : 'Make it a TH8NK day first'); return; }
          if (thank() < 3) { toast('Not enough in the TH8NK'); return; }
          e.thankPull = (e.thankPull || 0) + 3;
          commit(true); toast('Pulled 3, gained 1 point'); return;
        }
        if (a === 'dep3') {
          if ((j8().depAvail[dk] || 0) < 3) { toast('Only ' + fmt(j8().depAvail[dk] || 0) + ' spare that day'); return; }
          e.thankDep = (e.thankDep || 0) + 3;
          commit(true); toast('Deposited 3, landed as 4'); return;
        }
      });
    });

    Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-werk]'), function (b) {
      b.addEventListener('click', function () {
        var w = b.getAttribute('data-werk');
        var t = e.types || (e.types = []);
        var i = t.indexOf(w);
        if (i === -1) t.push(w); else t.splice(i, 1);
        e.types = WERK.filter(function (x) { return t.indexOf(x) !== -1; });   // keep WERKOUTS order
        commit(true);
      });
    });

    Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-fit]'), function (b) {
      b.addEventListener('click', function () {
        var f = b.getAttribute('data-fit');
        var items = e.items || (e.items = {});
        var next = fitNext(items[f]);
        if (next) items[f] = next; else delete items[f];
        e.logged = true;
        commit(true);
      });
    });
  }

  /* ---------------- sample data ----------------
     A month of invented entries so the whole thing can be seen working before
     it holds anything real. Everything starts on 1 Aug so all eight are live.
     Deterministic, so the same figures come back every time and can be checked
     by hand. Flagged loudly and wiped in one tap.                             */
  function loadDemo() {
    var seed = 20260801;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }

    var starts = {};
    HABITS.forEach(function (h) { starts[h.id] = '2026-08-01'; });

    var names = ['Mom', 'Dave', 'Sarah', 'Pastor Jim', 'Aunt Ruth', 'Kyle', 'Grandma'];
    var acts  = ['picked up trash on the walk', 'held the door at the store',
                 'paid for the car behind me', 'carried groceries for a neighbour',
                 'let someone merge', 'shovelled next door', 'left a tip for the cleaner'];

    var days = {}, d = parse('2026-08-01'), end = today;
    while (daysBetween(d, end) >= 0) {
      var dk = key(d), day = {};

      day.BED = { done: true };
      day.H2Only = { logged: true };
      day.NOTE = { done: true, who: names[Math.floor(rnd() * names.length)] };
      day.RAK  = { done: true, note: acts[Math.floor(rnd() * acts.length)] };

      var r = rnd();
      day.WERKOUTS = (r < 0.15)
        ? { done: false, min: 21, types: ['S'] }
        : { done: true, min: 31, types: (rnd() < 0.5 ? ['W', 'K'] : ['R', 'O']) };

      day.STOP = { logged: true };
      day.FIT  = { logged: true };
      if (rnd() < 0.25) day.FIT.items = { W: 'u' };

      var startH = 10 + Math.floor(rnd() * 3);
      var len = 7 + Math.floor(rnd() * 3);                 // 7-9 hours
      day.JUST8 = {
        eatStart: String(startH).padStart(2, '0') + ':00',
        eatEnd:   String((startH + len) % 24).padStart(2, '0') + ':00'
      };
      if (rnd() < 0.4) day.JUST8.cups = Math.round(rnd() * 8) / 4;
      if (rnd() < 0.25) day.JUST8.cupS = 0.25;

      days[dk] = day;
      d = addDays(d, 1);
    }

    // A few deliberate landmarks so the interesting states are visible.
    if (days['2026-08-09']) { days['2026-08-09'].BED = { miss: true }; }
    if (days['2026-08-14']) { days['2026-08-14'].H2Only = { broke: true, logged: true }; }
    if (days['2026-08-19']) { days['2026-08-19'].STOP = { slip: true, min: 4, logged: true }; }
    if (days['2026-08-22']) { days['2026-08-22'].JUST8.trav = 'T'; days['2026-08-22'].JUST8.cupS = 2; }
    if (days['2026-08-25']) { days['2026-08-25'].FIT = { logged: true, items: { M: 'u', F: 'U' }, miss: true }; }

    // The R shortlist is a preference, not data - it survives a reseed.
    state = { starts: starts, days: days, demo: true, rakList: state.rakList };
    _j8 = null;
    save(); render();
    toast('Sample data loaded');
  }

  function wipeAll() {
    state = { starts: {}, days: {}, rakList: state.rakList };   // shortlist survives a wipe
    HABITS.forEach(function (h) { state.starts[h.id] = DEFAULT_STARTS[h.id]; });
    _j8 = null;
    save(); render();
    toast('Wiped clean');
  }

  // In the sandbox the bar re-seeds rather than empties - an empty practice
  // app is useless, and there is nothing here worth keeping anyway.
  document.getElementById('demobar').addEventListener('click', function () {
    if (SANDBOX) loadDemo(); else wipeAll();
  });

  /* ---------------- menu ---------------- */
  document.getElementById('menu').addEventListener('click', function () { openOv('ovMenu'); });
  document.getElementById('mDemo').addEventListener('click', function () { closeOv('ovMenu'); loadDemo(); });
  document.getElementById('mWipe').addEventListener('click', function () {
    closeOv('ovMenu');
    sheetEl.innerHTML = head('Wipe everything?', 'This cannot be undone') +
      '<div class="note">Every entry goes, and the start dates return to your real ones. Export first if there is anything here worth keeping.</div>' +
      '<div class="btns"><button class="btn ghost" data-act="x">Keep it</button><button class="btn danger" data-act="go">Wipe</button></div>';
    sheetEl.querySelector('[data-act="x"]').addEventListener('click', function () { closeOv('ovSheet'); });
    sheetEl.querySelector('[data-act="go"]').addEventListener('click', function () { closeOv('ovSheet'); wipeAll(); });
    openOv('ovSheet');
  });

  function shortDate(s) {
    return parse(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function openStreaks() {
    sheetEl.innerHTML = head('Streaks', 'Tap one for its full history') +
      HABITS.map(function (h) {
        var segs = segsOf(h.id);
        var cur  = segs.filter(function (s) { return s.current; })[0];
        var best = segs.reduce(function (m, s) { return Math.max(m, s.days); }, 0);
        var breaks = segs.filter(function (s) { return !s.current; }).length;
        return '<button class="srow" data-hab="' + h.id + '">' +
          '<span class="sn"><b>' + h.id + '</b><small>since ' + shortDate(state.starts[h.id]) +
            (breaks ? ' &middot; ' + breaks + ' break' + (breaks === 1 ? '' : 's') : ' &middot; never broken') + '</small></span>' +
          '<span class="sv"><b>' + (cur ? cur.days.toLocaleString() : '0') + '</b><small>now</small></span>' +
          '<span class="sv" style="margin-left:12px"><b>' + best.toLocaleString() + '</b><small>best</small></span>' +
        '</button>';
      }).join('') +
      '<div class="btns"><button class="btn ghost" data-act="x">Close</button></div>';

    sheetEl.querySelector('[data-act="x"]').addEventListener('click', function () { closeOv('ovSheet'); });
    Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-hab]'), function (b) {
      b.addEventListener('click', function () { openHabitStreaks(b.getAttribute('data-hab')); });
    });
    openOv('ovSheet');
  }

  // Cheap memo - the walk is the same for a whole sheet render.
  var _segs = {};
  function segsOf(id) {
    if (!_segs[id]) _segs[id] = streakSegments(id);
    return _segs[id];
  }

  function openHabitStreaks(id) {
    var segs = segsOf(id).slice().reverse();     // newest first
    var best = segs.reduce(function (m, s) { return Math.max(m, s.days); }, 0);
    sheetEl.innerHTML = head(id, 'Started ' + shortDate(state.starts[id]) + ' &middot; best ' + best.toLocaleString() + ' days') +
      (segs.length
        ? segs.map(function (s) {
            return '<div class="seg' + (s.current ? ' cur' : '') + '">' +
              '<span class="sd">' + shortDate(s.from) + ' &rarr; ' + (s.current ? 'now' : shortDate(s.to)) + '</span>' +
              '<b>' + s.days.toLocaleString() + ' day' + (s.days === 1 ? '' : 's') +
              (s.days === best && best > 0 ? ' &starf;' : '') + '</b></div>';
          }).join('')
        : '<div class="note">Not started yet.</div>') +
      '<div class="btns"><button class="btn ghost" data-act="back">Back</button></div>';
    sheetEl.querySelector('[data-act="back"]').addEventListener('click', openStreaks);
    openOv('ovSheet');
  }

  document.getElementById('mStreaks').addEventListener('click', function () {
    closeOv('ovMenu'); _segs = {}; openStreaks();
  });

  document.getElementById('mStarts').addEventListener('click', function () {
    closeOv('ovMenu');
    sheetEl.innerHTML = head('Start dates', 'When each streak began') +
      HABITS.map(function (h) {
        return '<div class="field"><label>' + h.id + '</label>' +
          '<input type="text" data-start="' + h.id + '" value="' + state.starts[h.id] + '" placeholder="YYYY-MM-DD" autocomplete="off"></div>';
      }).join('') +
      '<div class="btns"><button class="btn go" data-act="savestarts">Save</button></div>';
    sheetEl.querySelector('[data-act="savestarts"]').addEventListener('click', function () {
      var bad = null;
      Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-start]'), function (i) {
        var v = i.value.trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || isNaN(parse(v).getTime())) { bad = i.getAttribute('data-start'); return; }
        state.starts[i.getAttribute('data-start')] = v;
      });
      if (bad) { toast('Check ' + bad + ' - use YYYY-MM-DD'); return; }
      save(); render(); closeOv('ovSheet'); toast('Saved');
    });
    openOv('ovSheet');
  });

  document.getElementById('mAbout').addEventListener('click', function () {
    closeOv('ovMenu');
    sheetEl.innerHTML = head('About', APP_VERSION + (SANDBOX ? ' &middot; sandbox' : '')) +
      '<div class="note">' +
      'Everything you tap stays on this phone. Nothing is uploaded, there is no account, and it works with no signal.<br><br>' +
      '<b>Every streak holds by default.</b> Days you never opened the app still count as kept. Nothing breaks until you say it broke.<br><br>' +
      'To record a miss after the fact, <b>tap the date at the top</b>, pick the day it happened, then open that habit and choose Mark missed. Same for filling in details from days you were offline.<br><br>' +
      'Because the data is only here, use <b>Export for Claude</b> now and then so the history reaches HEALTH.md. Clearing this browser\'s site data erases everything, so export before doing that.' +
      '</div><div class="btns"><button class="btn ghost" data-act="x">Close</button></div>';
    sheetEl.querySelector('[data-act="x"]').addEventListener('click', function () { closeOv('ovSheet'); });
    openOv('ovSheet');
  });

  /* ---------------- export ---------------- */
  function buildExport() {
    var o = [];
    o.push('HABITS EXPORT - ' + key(today));
    o.push('');
    o.push('BANKS   8ANK ' + fmt(bank8()) + '   TH8NK ' + fmt(thank()) + '   STOP ' + fmt(stopBank()) + ' min');
    o.push('');
    HABITS.forEach(function (h) {
      var s = streak(h.id);
      var segs = streakSegments(h.id);
      var best = segs.reduce(function (m2, x) { return Math.max(m2, x.days); }, 0);
      var breaks = segs.filter(function (x) { return !x.current; }).length;
      o.push(h.id + '  -  start ' + state.starts[h.id] +
             '  |  now ' + (s < 0 ? 'not started' : s + ' d') +
             '  |  best ' + best + ' d' +
             '  |  breaks ' + breaks);
    });

    o.push('');
    o.push('EVERY STREAK');
    HABITS.forEach(function (h) {
      var segs = streakSegments(h.id);
      if (!segs.length) return;
      o.push(h.id + ':');
      segs.slice().reverse().forEach(function (x) {
        o.push('  ' + x.from + ' -> ' + (x.current ? 'now' : x.to) + '  ' + x.days + ' d' + (x.current ? '  (current)' : ''));
      });
    });

    o.push('');
    o.push('DAILY LOG');
    Object.keys(state.days).sort().reverse().forEach(function (dk) {
      var day = state.days[dk], bits = [];
      HABITS.forEach(function (h) {
        var e = day[h.id];
        if (!e) return;
        var p = [];
        if (e.miss) p.push('MISS');
        if (e.broke) p.push('broke');
        if (e.done) p.push('done');
        if (e.slip) p.push('slip' + (e.min || 0));
        if (h.id === 'WERKOUTS' && e.min) p.push(e.min + 'min');
        if (e.types && e.types.length) p.push(e.types.join(''));
        if (e.note) p.push('"' + e.note + '"');
        if (e.who) p.push('->' + e.who);
        if (e.bed) p.push('bed' + e.bed);
        if (e.items) p.push(Object.keys(e.items).map(function (k) { return k + '-' + e.items[k]; }).join(','));
        if (e.mPts) p.push('M' + e.mPts + 'pt');
        if (e.eatStart || e.eatEnd) p.push((e.eatStart || '?') + '-' + (e.eatEnd || '?'));
        if (e.cups) p.push(e.cups + 'c');
        if (e.cupS) p.push(e.cupS + 'C');
        if (e.trav) p.push(e.trav === 'T' ? 'TH8NKDAY' : 'HOLIDAY');
        if (e.thankPull) p.push('pull' + e.thankPull);
        if (e.thankDep) p.push('dep' + e.thankDep);
        if (p.length) bits.push(h.id + ': ' + p.join(' '));
      });
      if (bits.length) o.push(dk + '  ' + bits.join('  |  '));
    });
    o.push('');
    o.push('--- BACKUP (for restoring the app, ignore otherwise) ---');
    o.push(JSON.stringify(state));
    return o.join('\n');
  }

  document.getElementById('mExport').addEventListener('click', function () {
    closeOv('ovMenu');
    sheetEl.innerHTML = head('Export', 'Paste this into a Claude session') +
      '<textarea id="exText" readonly></textarea>' +
      '<div class="btns"><button class="btn ghost" data-act="x">Close</button><button class="btn go" data-act="copy">Copy</button></div>';
    document.getElementById('exText').value = buildExport();
    sheetEl.querySelector('[data-act="x"]').addEventListener('click', function () { closeOv('ovSheet'); });
    sheetEl.querySelector('[data-act="copy"]').addEventListener('click', function () {
      var ta = document.getElementById('exText'), ok = false;
      try {
        ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0, 999999);
        ok = document.execCommand('copy'); ta.setAttribute('readonly', '');
      } catch (err) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(
          function () { toast('Copied'); },
          function () { toast(ok ? 'Copied' : 'Select the text and copy'); });
      } else { toast(ok ? 'Copied' : 'Select the text and copy'); }
    });
    openOv('ovSheet');
  });

  /* ---------------- nav ---------------- */
  document.getElementById('prev').addEventListener('click', function () { viewing = addDays(viewing, -1); render(); });
  document.getElementById('next').addEventListener('click', function () { if (viewing < today) { viewing = addDays(viewing, 1); render(); } });

  document.getElementById('datePick').addEventListener('change', function () {
    if (!this.value) return;
    var d = parse(this.value);
    if (isNaN(d.getTime()) || d > today) { this.value = key(viewing); return; }
    viewing = startOfDay(d);
    render();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var now = startOfDay(new Date());
    if (now.getTime() !== today.getTime()) {
      var wasToday = (viewing.getTime() === today.getTime());
      today = now;
      if (wasToday) viewing = now;
      render();
    }
  });

  load();

  // The sandbox arrives already full - an empty practice app shows nothing.
  if (SANDBOX && Object.keys(state.days).length === 0) loadDemo();
  else render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
